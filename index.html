<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GTA Meth Attack 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffe14a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="view" width="960" height="540"></canvas>
  <p id="fps">FPS</p>
  <p id="boot-error" hidden></p>
  <script type="module">
    import("./js/main.js").catch((error) => {
      const el = document.getElementById("boot-error");
      el.hidden = false;
      el.textContent = "The game failed to load. " + (error && error.message ? error.message : "");
    });
  </script>
</body>
</html>
