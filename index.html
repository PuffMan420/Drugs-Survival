<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drugs Survival</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffe14a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css?v=2" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
    }
  }
  </script>
</head>
<body class="is-menu">
  <div id="intro">
    <canvas id="intro-view" aria-hidden="true"></canvas>
    <p id="intro-status">Loading the intro…</p>
    <p id="intro-error" hidden></p>
    <button id="intro-skip" type="button">Skip</button>
    <div id="intro-flash" hidden></div>
  </div>
  <div id="start-menu" hidden>
    <img id="menu-bg" src="./menu%20background.jpg" alt="" />
    <div id="menu-card">
      <div id="menu-home">
        <h1>DSA</h1>
        <p id="menu-note">The city is still loading.</p>
        <button id="menu-play" type="button" disabled>Play</button>
        <button id="menu-settings" type="button">Settings</button>
      </div>
      <div id="menu-settings-page" hidden>
        <h1>Settings</h1>
        <p>The choices come later.</p>
        <button id="menu-back" type="button">Back</button>
      </div>
    </div>
  </div>
  <canvas id="view" width="1920" height="1080"></canvas>
  <p id="fps">FPS</p>
  <p id="place">Southwest</p>
  <canvas id="minimap" width="200" height="200"></canvas>
  <p id="hint">M map · 1–8 places · B build</p>
  <div id="map-overlay" hidden>
    <canvas id="map-full" width="200" height="200"></canvas>
    <p id="map-help">Island. Yellow dot is you, white box is the camera, blue marks are jumps 1–8. M or Esc closes this.</p>
  </div>
  <p id="boot-error" hidden></p>
  <script type="module">
    import { markMenuFailed } from "./js/start-menu.js";

    function showBoot(error) {
      const message = "The game failed to load. " + (error && error.message ? error.message : "");
      const el = document.getElementById("boot-error");
      el.hidden = false;
      el.textContent = message;
      markMenuFailed(message);
    }

    import("./js/intro.js").catch((error) => {
      const el = document.getElementById("intro-error");
      if (!el) return;
      el.hidden = false;
      el.textContent = "The intro failed to load. " + (error && error.message ? error.message : "");
    });
    import("./js/main.js").catch((error) => {
      showBoot(error);
    });
  </script>
</body>
</html>
