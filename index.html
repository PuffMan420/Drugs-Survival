<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drugs Survival</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffe14a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="view" width="1920" height="1080"></canvas>
  <p id="fps">FPS</p>
  <p id="place">Downtown</p>
  <canvas id="minimap" width="200" height="200"></canvas>
  <p id="hint">M map · 1–9 places · B build</p>
  <div id="map-overlay" hidden>
    <canvas id="map-full" width="200" height="200"></canvas>
    <p id="map-help">Whole downtown. Yellow dot is you, white box is the camera, blue marks are jumps 1–9. M or Esc closes this.</p>
  </div>
  <p id="boot-error" hidden></p>
  <script type="module">
    import("./js/main.js").catch((error) => {
      const el = document.getElementById("boot-error");
      el.hidden = false;
      el.textContent = "The game failed to load. " + (error && error.message ? error.message : "");
    });
  </script>
</body>
</html>
